services:
  # Backend FastAPI Service
  - type: web
    name: cashtrail-backend
    plan: free
    env: python
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
      - key: FRONTEND_URL
        value: "https://cashtrail-frontend.onrender.com"

  # Frontend Vite Static Site
  - type: web
    name: cashtrail-frontend
    env: static
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: "./frontend/dist"
    envVars:
      - key: NODE_VERSION
        value: 22.22.0
      - key: VITE_API_BASE_URL
        value: "https://cashtrail-backend.onrender.com"